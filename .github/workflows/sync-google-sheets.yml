name: Sync Team Members from Google Sheets

on:
  schedule:
    # Run daily at 6 AM UTC (1 AM EST / 2 AM EDT)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual triggering
  push:
    branches:
      - main
    paths:
      - 'scripts/sync_team_from_sheets.R'
      - '.github/workflows/sync-google-sheets.yml'

permissions:
  contents: write

jobs:
  sync-team-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("googlesheets4", "googledrive", "readr", "dplyr"))'

      - name: Create secrets directory
        run: mkdir -p .secrets

      - name: Set up Google service account credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > .secrets/google-service-account.json

      - name: Set Google Sheet ID environment variable
        env:
          POPCORN_TEAM_SHEET_ID: ${{ secrets.POPCORN_TEAM_SHEET_ID }}
        run: |
          echo "POPCORN_TEAM_SHEET_ID=$POPCORN_TEAM_SHEET_ID" >> $GITHUB_ENV

      - name: Sync team members from Google Sheets
        run: |
          Rscript scripts/sync_team_from_sheets.R sync

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet data/team-members.csv; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/team-members.csv
          git commit -m "Update team members from Google Sheets"
          git push
