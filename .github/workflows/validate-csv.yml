name: Validate CSV Files

on:
  pull_request:
    paths:
      - 'data/**.csv'
  push:
    branches:
      - main
    paths:
      - 'data/**.csv'

jobs:
  validate-csv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"

      - name: Install validation packages
        run: R -e 'install.packages(c("readr", "dplyr"))'

      - name: Validate team-members.csv
        run: |
          R -e '
          library(readr)
          library(dplyr)

          cat("## CSV Validation Rules\n\n")
          cat("1. Required columns must exist\n")
          cat("2. first_name and last_name must not be empty\n")
          cat("3. affiliation_primary must not be empty\n")
          cat("4. No leading/trailing whitespace in key text fields\n")
          cat("5. ORCID must match format 0000-0000-0000-0000 (if provided)\n")
          cat("6. No duplicate entries (same first_name + last_name + affiliation_primary)\n")
          cat("7. web_bio should be a URL (if provided)\n\n")

          # Read CSV (trim_ws automatically handles trailing whitespace)
          tryCatch({
            team <- read_csv("data/team-members.csv", show_col_types = FALSE, comment = "#", trim_ws = TRUE)
          }, error = function(e) {
            stop("❌ Failed to read CSV: ", e$message)
          })

          errors <- c()
          warnings <- c()

          # Helper: TRUE when a value is meaningful (not NA, blank, or the literal "NA")
          has_value <- function(x) !is.na(x) & x != "" & x != "NA"

          # Rule 1: Required columns must exist
          # These mirror the columns written by scripts/sync_team_from_sheets.R
          required_cols <- c("first_name", "last_name", "post_nominal_initials",
                            "affiliation_primary", "affiliation_2", "affiliation_3", "affiliation_4",
                            "strategic_advisory_cmt", "cihr_study", "study_team", "web_bio", "ORCID")

          missing_cols <- setdiff(required_cols, names(team))
          if (length(missing_cols) > 0) {
            errors <- c(errors, paste("Missing required columns:", paste(missing_cols, collapse = ", ")))
          }

          # Rule 2: first_name and last_name must not be empty
          missing_name <- team %>%
            filter(is.na(first_name) | trimws(first_name) == "" |
                   is.na(last_name) | trimws(last_name) == "")
          if (nrow(missing_name) > 0) {
            errors <- c(errors, paste("Found", nrow(missing_name), "rows with missing first_name or last_name"))
          }

          # Rule 3: affiliation_primary must not be empty
          missing_affil <- team %>% filter(is.na(affiliation_primary) | trimws(affiliation_primary) == "")
          if (nrow(missing_affil) > 0) {
            warnings <- c(warnings, paste("Found", nrow(missing_affil), "rows with missing affiliation_primary"))
          }

          # Rule 4: Check for trailing/leading whitespace (re-read without trimming)
          team_raw <- read_csv("data/team-members.csv", show_col_types = FALSE, comment = "#", trim_ws = FALSE)

          whitespace_issues <- team_raw %>%
            filter(
              (!is.na(first_name) & first_name != trimws(first_name)) |
              (!is.na(last_name) & last_name != trimws(last_name)) |
              (!is.na(affiliation_primary) & affiliation_primary != trimws(affiliation_primary))
            )

          if (nrow(whitespace_issues) > 0) {
            warnings <- c(warnings, paste("Found", nrow(whitespace_issues),
                                        "rows with leading/trailing whitespace"))
            for (i in 1:min(nrow(whitespace_issues), 3)) {
              warnings <- c(warnings, paste("  - Row", i, ":", whitespace_issues$first_name[i],
                                            whitespace_issues$last_name[i]))
            }
          }

          # Rule 5: ORCID format validation
          if ("ORCID" %in% names(team)) {
            invalid_orcid <- team %>%
              filter(has_value(ORCID)) %>%
              filter(!grepl("^[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X]$", ORCID))

            if (nrow(invalid_orcid) > 0) {
              warnings <- c(warnings, "Invalid ORCID format (should be 0000-0000-0000-0000):")
              for (i in 1:nrow(invalid_orcid)) {
                warnings <- c(warnings, paste("  -", invalid_orcid$first_name[i],
                                              invalid_orcid$last_name[i], ":", invalid_orcid$ORCID[i]))
              }
            }
          }

          # Rule 6: Check for duplicate entries
          duplicates <- team %>%
            group_by(first_name, last_name, affiliation_primary) %>%
            filter(n() > 1) %>%
            ungroup()

          if (nrow(duplicates) > 0) {
            warnings <- c(warnings, "Found duplicate entries (same first_name + last_name + affiliation_primary):")
            for (i in 1:nrow(duplicates)) {
              warnings <- c(warnings, paste("  -", duplicates$first_name[i], duplicates$last_name[i],
                                            "at", duplicates$affiliation_primary[i]))
            }
          }

          # Rule 7: web_bio should look like a URL (if provided)
          if ("web_bio" %in% names(team)) {
            invalid_bio <- team %>%
              filter(has_value(web_bio) & web_bio != "n/a" & web_bio != ".") %>%
              filter(!grepl("^https?://", web_bio))

            if (nrow(invalid_bio) > 0) {
              warnings <- c(warnings, "web_bio values that are not URLs:")
              for (i in 1:nrow(invalid_bio)) {
                warnings <- c(warnings, paste("  -", invalid_bio$first_name[i], invalid_bio$last_name[i],
                                              ":", invalid_bio$web_bio[i]))
              }
            }
          }

          # Print results
          cat("\n## Validation Results\n\n")

          if (length(errors) > 0) {
            cat("❌ ERRORS:\n")
            for (error in errors) {
              cat("  ", error, "\n")
            }
            cat("\n")
          }

          if (length(warnings) > 0) {
            cat("⚠️  WARNINGS:\n")
            for (warning in warnings) {
              cat("  ", warning, "\n")
            }
            cat("\n")
          }

          if (length(errors) == 0 && length(warnings) == 0) {
            cat("✅ All validation rules passed!\n\n")
          }

          # Summary (sections are derived from role columns, not a Section column)
          cat("## Summary\n")
          cat("Total rows:", nrow(team), "\n")
          cat("Strategic Advisory Committee:", sum(has_value(team$strategic_advisory_cmt)), "\n")
          cat("Investigators and collaborators:", sum(has_value(team$cihr_study)), "\n")
          cat("Study team:", sum(has_value(team$study_team)), "\n")

          # Fail if errors found
          if (length(errors) > 0) {
            stop("\n❌ CSV validation failed with ", length(errors), " error(s)")
          }
          '
